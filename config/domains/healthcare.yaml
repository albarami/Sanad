  enhancement_instructions: |
    6. For medical topics, prioritize peer-reviewed research and clinical guidelines
    7. Use appropriate medical terminology and ICD-10 codes where relevant
    8. Acknowledge evidence levels and clinical recommendations
    9. Distinguish between established treatments and experimental therapies
