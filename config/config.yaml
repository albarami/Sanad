# Sanad v2 Configuration File
# This file contains default configuration values for the application

# API Keys (will be loaded from environment variables)
openai_api_key: ${OPENAI_API_KEY}
anthropic_api_key: ${ANTHROPIC_API_KEY}

# LLM Configuration
llm:
  primary_provider: "openai"
  fallback_provider: "anthropic"
  
  openai:
    model: "gpt-4o-mini"
    temperature: 0.3
    max_tokens: 150
    timeout: 60.0
    
  anthropic:
    model: "claude-3-haiku-20240307"
    temperature: 0.3
    max_tokens: 150
    timeout: 60.0

# Agent Weights
agent_weights:
  integrity: 0.4
  precision: 0.3
  provenance: 0.2
  domain: 0.1

# Thresholds
thresholds:
  trigger_similarity: 0.72
  enhancement_threshold: 0.70
  high_confidence: 0.85

# Retrieval Configuration
retrieval:
  top_k: 5
  chunk_size: 500
  chunk_overlap: 100

# Performance Targets
performance:
  max_latency_ms: 1000
  target_retrieval_ms: 10

# Domain Configuration (configurable for different contexts)
domain:
  name: "islamic_knowledge"  # Options: islamic_knowledge, healthcare, finance, labor_market, general
  keywords:
    - "islam"
    - "islamic"
    - "muslim"
    - "quran"
    - "hadith"
    - "sunnah"
    - "prophet"
    - "allah"
    - "muhammad"
    - "prayer"
    - "salah"
    - "hajj"
    - "zakat"
    - "fasting"
    - "ramadan"
    - "mosque"
    - "imam"
    - "scholar"
    - "fiqh"
    - "sharia"
    - "halal"
    - "haram"
  enhancement_instructions: |
    6. For Islamic topics, prioritize authentic sources and scholarly consensus
    7. Use appropriate Islamic terminology and transliterations
    8. Acknowledge different schools of thought when relevant
    9. Distinguish between established rulings and scholarly opinions
  terminology_guidelines: "Use proper Arabic transliterations and Islamic scholarly terminology"
  source_requirements: "Prioritize Quran, authentic Hadith, and recognized Islamic scholars"